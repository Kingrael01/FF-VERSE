<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 500" role="img" aria-label="FFVERSE gaming logo">
  <defs>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff36a"/>
      <stop offset=".35" stop-color="#ffc400"/>
      <stop offset="1" stop-color="#ff6500"/>
    </linearGradient>
    <linearGradient id="silver" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset=".5" stop-color="#c8d0dc"/>
      <stop offset="1" stop-color="#747d8c"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="7" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- dark badge -->
  <path d="M55 250 L125 170 L215 188 L285 112 L405 150 L600 72 L795 150 L915 112 L985 188 L1075 170 L1145 250 L1075 330 L985 312 L915 388 L795 350 L600 428 L405 350 L285 388 L215 312 L125 330 Z"
        fill="#090a12" stroke="url(#gold)" stroke-width="12" filter="url(#glow)"/>

  <!-- crown -->
  <path d="M535 112 L565 45 L600 91 L635 45 L665 112 L650 135 L550 135 Z"
        fill="#0a0a0d" stroke="url(#gold)" stroke-width="9" stroke-linejoin="round"/>
  <path d="M550 135 H650" stroke="#ffc400" stroke-width="10"/>

  <!-- FF -->
  <text x="505" y="315" text-anchor="end"
        font-family="Impact, Haettenschweiler, 'Arial Black', sans-serif"
        font-size="210" font-style="italic" font-weight="900"
        fill="url(#gold)" stroke="#2b1600" stroke-width="16" paint-order="stroke"
        letter-spacing="-18">FF</text>

  <!-- VERSE -->
  <text x="500" y="315"
        font-family="Impact, Haettenschweiler, 'Arial Black', sans-serif"
        font-size="190" font-style="italic" font-weight="900"
        fill="url(#silver)" stroke="#090a12" stroke-width="15" paint-order="stroke"
        letter-spacing="-9">VERSE</text>

  <!-- speed slashes -->
  <g fill="url(#gold)">
    <path d="M85 370 L260 330 L170 365 L275 350 L115 405 Z"/>
    <path d="M925 350 L1030 365 L940 370 L1115 405 L955 350 Z"/>
  </g>

  <!-- bottom winged F -->
  <path d="M455 385 L515 365 L555 382 L600 360 L645 382 L685 365 L745 385 L680 402 L650 425 L600 405 L550 425 L520 402 Z"
        fill="#0a0a0d" stroke="url(#gold)" stroke-width="8"/>
  <text x="600" y="417" text-anchor="middle"
        font-family="Arial Black, sans-serif" font-size="58" font-weight="900"
        fill="url(#gold)">F</text>
</svg>